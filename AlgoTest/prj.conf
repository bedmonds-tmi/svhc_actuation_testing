# PDM setup
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

#LOG subsystem related configs
CONFIG_LOG=y

#net buf options
CONFIG_NET_BUF=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_RING_BUFFER=y

# Math functions from CMSIS-DSP
CONFIG_CMSIS_DSP=y
